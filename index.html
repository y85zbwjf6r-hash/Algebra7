<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457e8">
  <meta name="description" content="SandyQumar — мектеп математикасын түсініп үйрен. 7 және 9-сынып: алгебра, геометрия, сабақтар мен автоматты тексерілетін тапсырмалар. Тіркелусіз.">
  <title>SandyQumar — сандарға құмар оқушыларға</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%232457e8%22/%3E%3Ctext x=%2232%22 y=%2240%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-size=%2225%22 font-weight=%22700%22%3ESQ%3C/text%3E%3C/svg%3E">
  <style>:root{--blue:#2457e8;--blue-dark:#1743bf;--ink:#182944;--muted:#67758b;--line:#e5eaf2;--surface:#fff;--bg:#f7f9fc;--green:#13715a;--radius:18px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:16px;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);line-height:1.6}
button,input{font:inherit}
button,a,input,summary{-webkit-tap-highlight-color:transparent}
button,a,summary{touch-action:manipulation}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.25;letter-spacing:-.025em}
h1{font-size:2.35rem;font-weight:750}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:680}
p{line-height:1.75}
input{min-width:0}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #507fff;outline-offset:4px}
[hidden]{display:none!important}
.icon{width:22px;height:22px;flex-shrink:0;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-100px;left:24px;z-index:100;background:var(--ink);color:white;padding:12px 20px;border-radius:12px}
.skip-link:focus{top:16px}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:242px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:32px 20px 22px;z-index:40;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;font-size:1.6rem;font-weight:760;letter-spacing:-.045em;padding:0 9px;margin-bottom:53px;line-height:1.15}
.brand-symbol{width:43px;height:47px;display:grid;place-items:center;border-radius:12px;background:var(--blue);font-family:Georgia,serif;font-size:2.15rem;color:white;box-shadow:0 5px 12px #2457e821}
.brand-grade{display:block;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.025em;margin-top:6px}
.nav-label{font-size:.7rem;letter-spacing:.12em;font-weight:650;color:#8b96a8;padding:0 14px;margin-bottom:13px}
.nav-link{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:10px;font-size:.94rem;font-weight:550;color:#66738a;margin-bottom:6px;transition:background .15s,color .15s}
.nav-link:hover{background:#f3f6fc;color:var(--ink)}
.nav-link.active{background:#eaf0ff;color:var(--blue);font-weight:650}
.nav-link.active .icon{stroke-width:2}
.sidebar-progress{margin:36px 12px 27px;padding:17px 0 19px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.progress-heading{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin-bottom:11px;gap:20px}
.progress-heading strong{font-size:.82rem;color:var(--blue);letter-spacing:.02em}
.progress-track{height:5px;border-radius:10px;background:#edf0f7;overflow:hidden}
.progress-track span{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .35s}
.sidebar-progress p{font-size:.73rem;color:#8994a6;margin-top:10px}
.secondary-nav{margin-top:auto}
.teacher-signature{display:flex;gap:10px;align-items:center;padding:22px 5px 0;margin-top:21px;border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;display:grid;place-items:center;background:#eef0f6;border:1px solid #e3e7ef;color:#637088;border-radius:50%;font-size:.71rem;letter-spacing:.04em}
.teacher-signature strong{display:block;font-size:.79rem;font-weight:650}
.teacher-signature small{font-size:.7rem;color:var(--muted)}
.workspace{margin-left:242px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:83px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid var(--line);background:#ffffffd9;gap:12px}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:18px}
.breadcrumb{font-size:.8rem;color:#8993a3}
.breadcrumb span{padding:0 12px;color:#c1c8d4}
.breadcrumb strong{color:#4d5c74;font-weight:550}
.open-badge{display:flex;gap:7px;align-items:center;font-size:.75rem;color:#5e6d82}
.open-badge .icon{width:17px;height:17px;color:#239a78}
.help-button{display:grid;place-items:center;color:#8793a7;padding-left:16px;border-left:1px solid var(--line)}
.help-button .icon{width:20px;height:20px}
.mobile-menu{display:none!important}
.icon-button{border:0;background:none;display:grid;place-items:center;width:38px;height:38px;border-radius:9px}
.icon-button:hover{background:#edf2ff}
main{padding:36px 44px 44px;max-width:1500px;width:100%;margin:0 auto;outline:none}
.hero{position:relative;background:#eaf0ff;border:1px solid #e0e8fd;border-radius:22px;min-height:350px;display:grid;grid-template-columns:1.15fr 1fr;gap:10px;overflow:hidden;padding:39px 36px 32px}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#cddaf050 1px,transparent 1px),linear-gradient(90deg,#cddaf050 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(100deg,transparent 35%,#000 100%);pointer-events:none}
.hero-copy{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:.65rem;letter-spacing:.11em;font-weight:650;color:#4667a2}
.eyebrow>span{height:5px;width:5px;background:#4f78dc;border-radius:50%}
.hero h1{font-size:clamp(2.2rem,3.3vw,3.4rem);letter-spacing:-.045em;line-height:1.15;margin:18px 0 16px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero-copy>p{color:#687b9c;font-size:.88rem;line-height:1.8;max-width:360px}
.hero-actions{display:flex;gap:11px;margin:24px 0 20px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:9px;border:1px solid transparent;font-size:.84rem;font-weight:620;line-height:1.4;text-align:center;transition:background .15s,box-shadow .15s,transform .15s}
.button .icon{width:18px;height:18px}
.button:hover{transform:translateY(-1px)}
.button:active{transform:translateY(0)}
.button.primary{background:var(--blue);color:#fff;box-shadow:0 3px 7px #2457e817}
.button.primary:hover{background:var(--blue-dark);box-shadow:0 5px 12px #2457e82a}
.button.light{background:#ffffffc7;border-color:#d5dff3;color:#47638f}
.button.light:hover{background:#fff}
.button.secondary{background:#fff;border-color:#dce4f0;color:#34517d}
.button.secondary:hover{background:#f3f6fc}
.button.ghost{background:transparent;border-color:transparent;color:#667992}
.button.ghost:hover{background:#edf2fa;color:#254c90}
.hero-note{display:flex;align-items:center;gap:7px;font-size:.67rem;color:#7b8dad;white-space:nowrap}
.hero-note .icon{width:13px;height:13px;color:#5e80bd}
.hero-note>span{color:#b3c1d8;padding:0 1px}
.hero-art{position:relative;align-self:center;padding:32px 0 32px 16px;transform:rotate(-3deg);margin:0 -8px 0 8px;min-width:0}
.graph-card{background:#fffffff2;border:1px solid #dce4f6;border-radius:14px;box-shadow:0 18px 35px #1c3a7021;padding:15px 13px 2px}
.graph-card-header{display:flex;align-items:center;gap:6px;font-size:.6rem;color:#8b99ad;padding:0 0 0 4px;white-space:nowrap}
.graph-dot{height:5px;width:5px;border-radius:50%;background:#51ba98}
.graph-equation{margin-left:auto;border:1px solid #e3e9f7;border-radius:5px;padding:3px 6px;color:#426dd1;font-size:.63rem}
.function-graph{width:100%;height:auto;display:block;overflow:visible}
.grid-line{stroke:#eaf0f8;stroke-width:1}
.axis-line{stroke:#b5c1d6;stroke-width:1.2}
.axis-label{font-family:Arial,sans-serif;font-size:11px;fill:#8b99b2}
.graph-line{stroke:#3a71e7;stroke-width:3;fill:none;stroke-linecap:round}
.graph-point{fill:#fff;stroke:#3a71e7;stroke-width:2.5}
.floating-formula{position:absolute;z-index:2;font-family:Georgia,"Times New Roman",serif;background:white;border:1px solid #e2e8f5;box-shadow:0 7px 19px #24497912;border-radius:11px;white-space:nowrap;color:#3b527a}
.top-formula{top:11px;right:11px;transform:rotate(9deg);font-size:1rem;padding:10px 16px}
.bottom-formula{bottom:13px;left:3px;transform:rotate(6deg);font-size:.88rem;padding:11px 15px;display:flex;gap:9px;align-items:center}
.formula-check{border-radius:50%;background:#def7ec;color:#239778;display:grid;place-items:center;width:22px;height:22px;font:600 .8rem Arial}
.overview-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;border:1px solid var(--line);border-radius:14px;background:white}
.overview-stats>div{display:flex;gap:13px;align-items:center;padding:21px 20px;position:relative;min-width:0}
.overview-stats>div+div:before{content:"";position:absolute;left:0;top:23px;bottom:23px;width:1px;background:var(--line)}
.overview-stats .icon{color:#7890b5;background:#f2f6fc;box-sizing:content-box;border-radius:11px;padding:10px;width:21px;height:21px}
.overview-stats strong{display:block;font-size:1.25rem;letter-spacing:-.035em;line-height:1.25}
.overview-stats>div:last-child strong{font-size:.9rem;letter-spacing:-.02em}
.overview-stats small{font-size:.66rem;color:#7a879b;line-height:1.45;display:block;margin-top:6px}
.stat-denominator{font-size:.83rem;color:#95a0b3;margin-left:2px;font-weight:500}
.section{margin-top:38px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.overline{display:block;font-size:.65rem;letter-spacing:.12em;font-weight:650;color:#8a98ae;margin-bottom:8px}
.section-heading h2{font-size:1.45rem}
.text-link{color:#5373a9;font-size:.8rem;font-weight:580}
.text-link:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.topic-card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:21px 21px 17px;transition:border .2s,box-shadow .2s,transform .2s;min-width:0}
.topic-card:hover{border-color:#bbcbed;box-shadow:0 9px 22px #254c9010;transform:translateY(-3px)}
.topic-card-top{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:18px}
.topic-icon{height:46px;width:46px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Georgia,"Times New Roman",serif;font-weight:550;font-style:italic;font-size:1.42rem;line-height:1}
.topic-icon.blue{background:#eaf0ff;color:#4470da}
.topic-icon.violet{background:#f0eafb;color:#8b68cf}
.topic-icon.teal{background:#e1f5ef;color:#269479;font-size:1.9rem}
.topic-icon.orange{background:#fff1df;color:#cb924b;font-style:normal;font-family:Arial;font-size:1.65rem}
.topic-icon.pink{background:#fbe9ef;color:#c16d8e;font-size:.83rem}
.topic-icon.green{background:#e9f3e5;color:#6b9c54;font-size:1.2rem}
.topic-duration{font-size:.67rem;display:flex;gap:4px;align-items:center;color:#93a0b4;white-space:nowrap}
.topic-duration .icon{width:13px;height:13px}
.status-tag{font-size:.63rem;display:flex;gap:3px;align-items:center;color:#21886e}
.status-tag .icon{width:13px;height:13px}
.topic-card h3{font-size:.99rem;line-height:1.4;min-height:2.8em;margin-bottom:9px}
.topic-card>p{font-size:.78rem;color:#8290a5;line-height:1.7;margin-bottom:14px;flex:1}
.topic-meta{display:flex;gap:12px;font-size:.65rem;color:#99a4b5}
.topic-meta span+span:before{content:"·";position:relative;left:-6px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;padding-top:13px;border-top:1px solid #edf0f5;font-size:.72rem;font-weight:550;color:#5374ab}
.card-count{font-size:.65rem;font-weight:500;color:#99a4b7}
.topic-card .progress-track{height:3px}
.learning-note{margin-top:28px;background:#edf5f3;border:1px solid #e1ede9;display:flex;gap:15px;padding:22px 25px;border-radius:14px}
.learning-note>.icon{color:#4b9a82;width:24px;height:24px;margin-top:1px}
.learning-note h3{color:#447e6d;font-size:.88rem;margin-bottom:5px}
.learning-note p{font-size:.77rem;color:#80998f}
.footer{display:flex;justify-content:space-between;gap:16px;padding:21px 44px;border-top:1px solid var(--line);font-size:.66rem;color:#98a3b4;margin-top:auto}
.footer a:hover{color:var(--blue)}
.footer-dot{padding:0 7px;color:#b4bdca}
.continue-card{display:flex;gap:15px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px 24px;margin-top:22px}
.continue-icon{background:#edf2ff;color:var(--blue);border-radius:12px;padding:10px;display:flex}
.continue-card h3{font-size:.95rem;margin-bottom:5px}
.continue-card p{font-size:.8rem;color:var(--muted)}
.continue-card .button{margin-left:auto;flex-shrink:0}
.page-heading{margin:8px 0 30px;max-width:760px}
.page-heading h1{margin:9px 0 13px}
.page-heading>p{font-size:.95rem;color:var(--muted)}
.muted{color:var(--muted);font-size:.82rem}
.small-text{font-size:.78rem;color:var(--muted);line-height:1.7}
.topics-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:25px 0 22px}
.search{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:9px;padding:0 12px;max-width:300px}
.search .icon{width:18px;height:18px;color:#8d9ab0}
.search input{border:0;background:transparent;width:210px;height:42px;outline:none;font-size:.82rem}
.search:focus-within{outline:2px solid #8eacff;outline-offset:2px}
.empty-search{background:white;border:1px solid var(--line);padding:40px;border-radius:14px;text-align:center;font-size:.9rem;color:var(--muted)}
.practice-banner{background:#edf1fd;border:1px solid #dfe7fb;border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.practice-banner>div{display:flex;gap:15px;align-items:center}
.practice-banner>div>.icon{height:29px;width:29px;color:#6686d6}
.practice-banner h3{margin-bottom:6px}
.practice-banner p{font-size:.84rem;color:#7186a7}
.practice-banner .button{flex-shrink:0}
.back-link{font-size:.8rem;color:#7487a4;display:inline-block;margin-bottom:25px}
.back-link:hover{color:var(--blue);text-decoration:underline}
.lesson-heading{display:flex;align-items:center;gap:19px;margin:4px 0 30px}
.lesson-heading .topic-icon{width:60px;height:60px;border-radius:16px;font-size:1.8rem}
.lesson-heading .topic-icon.pink{font-size:1rem}
.lesson-heading h1{font-size:2rem}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:26px;align-items:start}
.lesson-body{min-width:0}
.goal-box{display:flex;gap:15px;padding:20px 22px;background:#eaf0ff;border:1px solid #dfe7fd;border-radius:14px;margin-bottom:23px}
.goal-box>.icon{color:var(--blue);margin-top:1px}
.goal-box strong{font-size:.88rem;color:#3c5d95}
.goal-box p{font-size:.87rem;color:#5f789f;margin-top:4px}
.content-card{background:white;border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:28px}
.content-card>h2{font-size:1.25rem;margin:8px 0 24px}
.theory-paragraph+.theory-paragraph{margin-top:22px;padding-top:21px;border-top:1px solid #edf0f5}
.theory-paragraph h3{font-size:.96rem;margin-bottom:9px}
.theory-paragraph p{color:#697c96;font-size:.9rem;line-height:1.9}
.examples-section{margin-bottom:25px}
.examples-section .section-heading h2{font-size:1.25rem}
.example-card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:15px}
.example-label{font-size:.62rem;color:#7b96c2;font-weight:650;letter-spacing:.1em;display:block;margin-bottom:8px}
.example-card h3{font-size:.98rem}
.math-expression{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;line-height:1.8;letter-spacing:.01em;color:#315489;background:#f1f5fc;border-radius:9px;padding:13px 17px;margin:16px 0 14px;overflow-wrap:anywhere}
.example-card ol{margin:0;padding-left:19px;color:#7b8ba2;font-size:.83rem;line-height:1.9}
.example-card li{padding-left:4px;margin-top:4px}
.mistake-note{display:flex;gap:13px;padding:20px 22px;background:#fff7e9;border:1px solid #f5e9ce;border-radius:13px;margin-bottom:27px}
.mistake-note>.icon{color:#b88c3a}
.mistake-note strong{font-size:.84rem;color:#937530}
.mistake-note p{font-size:.83rem;color:#9a8a69;margin-top:4px}
.lesson-aside{position:sticky;top:24px}
.lesson-checklist{border:1px solid var(--line);background:white;padding:24px 21px;border-radius:15px}
.lesson-checklist h3{margin-bottom:20px}
.lesson-checklist>div:not(.progress-track):not(.progress-heading){display:flex;align-items:center;gap:10px;font-size:.8rem;color:#7b8ca6;margin-bottom:17px}
.lesson-checklist>div>.icon{width:18px;height:18px;color:#839aca}
.lesson-checklist hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.lesson-checklist .button{width:100%;margin-top:20px;font-size:.77rem;padding:11px}
.lesson-checklist .button.ghost{margin-top:8px;font-size:.73rem}
.quiet-note{display:flex;gap:8px;padding:18px 10px;font-size:.73rem;color:#94a0b3;line-height:1.7}
.quiet-note .icon{width:16px;height:16px;margin-top:3px}
.lesson-bottom{text-align:center;background:#eaf0ff;border:1px solid #dfe7fd;border-radius:15px;padding:29px 20px}
.lesson-bottom h2{font-size:1.28rem}
.lesson-bottom p{font-size:.87rem;color:#7690b7;margin:9px 0 20px}
.graph-explorer .section-heading{margin-bottom:10px}
.graph-explorer h2{font-size:1.25rem}
.explorer-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;align-items:center}
.graph-controls .math-expression{font-size:1.2rem;margin:0 0 17px}
.graph-controls label{font-size:.73rem;color:#73829a;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.graph-controls label strong{color:#466cb4;font-weight:600}
.graph-controls input{width:100%;accent-color:var(--blue);margin:12px 0 21px;min-height:22px}
.graph-controls input:last-of-type{margin-bottom:12px}
.graph-controls .small-text{font-size:.73rem}
.graph-values{font-size:.7rem;color:#6d85ab;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.graph-values span{background:#f3f6fc;padding:4px 7px;border-radius:4px}
.tag{border:1px solid #e1e7f3;background:#f5f7fc;color:#6d82a5;font-size:.69rem;padding:4px 10px;border-radius:6px;display:inline-block;font-weight:550}
.practice-shell{max-width:850px;margin:0 auto}
.practice-header{display:flex;justify-content:space-between;align-items:start;gap:15px}
.practice-header .tag{max-width:55%;text-align:right}
.practice-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 25px}
.practice-title h1{font-size:2.1rem}
.question-pager{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}
.question-step{display:grid;place-items:center;min-width:36px;height:36px;border-radius:9px;background:white;border:1px solid var(--line);color:#8c9bb1;font-size:.8rem}
.question-step:hover{border-color:#b3c7f3}
.question-step.current{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 3px 9px #2457e82b}
.question-step.done:not(.current){background:#eaf7f0;border-color:#cfeadd;color:#298b67}
.question-step.tried:not(.current){background:#fff4e2;border-color:#f0dfbd;color:#b18538}
.question-step .icon{width:17px;height:17px}
.question-card{background:white;border:1px solid var(--line);border-radius:20px;padding:34px 36px}

.question-meta>span+span:before{content:"·";margin-right:14px;color:#bcc7d8}
.question-card h2{font-size:1.35rem;line-height:1.6;letter-spacing:-.015em;margin-bottom:26px}
.task-formula{margin-top:-10px;margin-bottom:26px;padding:18px 22px;font-size:1.6rem}

.choice{display:flex;gap:13px;align-items:center;position:relative;min-height:69px;border:1px solid #e0e6f0;border-radius:11px;padding:14px 16px;font-size:1.05rem;cursor:pointer;transition:border .15s,background .15s}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice:hover{background:#f6f8ff;border-color:#bbccef}

.choice.selected{background:#edf2ff;border:2px solid var(--blue);padding:13px 15px;color:#2457c4}
.option-letter{width:29px;height:29px;display:grid;place-items:center;border-radius:7px;background:#f1f4f9;color:#8a9ab2;font-size:.73rem;flex-shrink:0}
.choice.selected .option-letter{background:var(--blue);color:white}
.answer-actions{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}

.answer-input::placeholder{color:#a3aec0;font-size:.86rem}
.numeric-input{max-width:330px;font-size:1.25rem}
.answer-label{display:block;font-size:.8rem;font-weight:550;color:#69809f;margin-bottom:9px}
.input-help{font-size:.74rem;color:#93a1b6;margin-top:10px}

.feedback>.icon{width:24px;height:24px;margin-top:1px}
.feedback strong{display:block;font-size:.96rem;margin-bottom:7px}
.feedback p{font-size:.86rem;line-height:1.8}
.feedback.correct{background:#edf8f1;border-color:#cce9d6;color:#37805d}
.feedback.incorrect{background:#fff7e9;border-color:#efdfbe;color:#98753a}
.feedback.invalid{background:#f4f6fd;border-color:#dfe5f8;color:#687da4}
.correct-answer{display:block;margin-top:10px;font-size:.82rem;font-weight:600}
.question-navigation{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:23px}
.practice-footnote{display:flex;justify-content:center;gap:6px;align-items:center;font-size:.72rem;color:#98a5b9;text-align:center;margin-top:24px}

.empty-state{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:55px 30px}

.empty-illustration>.icon{width:36px;height:36px;transform:rotate(5deg)}

.completion-ring>div{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column}

.summary-copy{flex:1}

.summary-copy p{font-size:.8rem;color:#8494ab;max-width:320px}
.summary-metrics{display:flex;gap:28px}
.summary-metrics>div{max-width:105px}
.summary-metrics strong{display:block;font-size:1.55rem;letter-spacing:-.04em;color:#45699e}
.summary-metrics span{font-size:.68rem;line-height:1.65;color:#93a0b5;display:block;margin-top:5px}
.results-list{border:1px solid var(--line);border-radius:15px;background:white;overflow:hidden}

.result-topic .topic-icon{width:40px;height:40px;font-size:1.25rem;border-radius:10px}

.result-topic h3{font-size:.9rem;margin-bottom:5px}
.result-topic .small-text{font-size:.69rem}
.result-progress{width:130px}
.result-row .button{font-size:.75rem}

.review-list strong{display:block;font-size:.84rem;font-weight:550;line-height:1.7}

  function fraction(value) {

    var a = decimal(bits[0]);

    var b = decimal(bits[1]);

<script>(function (root) {

      var a = source[task.id];
      if (!a || a.contentVersion !== task.version || typeof a.correct !== "boolean" || typeof a.firstCorrect !== "boolean") return;
      if (!Number.isInteger(a.count) || a.count < 1 || a.count > 1000000) return;

      attempts[task.id] = {

        answer:a.answer, count:a.count, usedHint:!!a.usedHint,
        firstUsedHint:!!a.firstUsedHint, updatedAt:typeof a.updatedAt === "string" ? a.updatedAt.slice(0,40) : ""

    if (raw) state = clean(JSON.parse(raw));

  function practice(group,index) {
    var topic=topicById(group);

    if(!tasks)return notFound();
    if(!Number.isInteger(index)||index<0||index>=tasks.length)return notFound();
    var task=tasks[index], actualTopic=topics.find(function(t){return t.tasks.some(function(x){return x.id===task.id;});});
    var saved=store.get().attempts[task.id];
    var answer=ui.draft!==null?ui.draft:saved?saved.answer:task.type==="fields"?task.fields.map(function(){return "";}):"";
    var result=ui.feedback || (saved?grader.grade(task,saved.answer):null);

    } else if(task.type==="number"){
      inputs='<label class="answer-label" for="numeric-answer">Жауабыңыз</label><input class="answer-input numeric-input" id="numeric-answer" name="answer" type="text" inputmode="decimal" autocomplete="off" maxlength="64" placeholder="Сан немесе бөлшек" value="'+esc(answer)+'"><p class="input-help">Мысалы: 5, −2, 0,25 немесе 1/4</p>';

      else feedback='<div class="feedback '+(result.correct?"correct":"incorrect")+'" id="feedback" tabindex="-1" role="status">'+icon(result.correct?"check":"bulb")+'<div><strong>'+(result.correct?"Дұрыс! Жарайсың.":"Түсіндірмені оқып, қайта байқап көр.")+'</strong><p>'+esc(task.explanation)+'</p>'+(result.correct?'':'<span class="correct-answer">Дұрыс жауап: '+esc(task.displayAnswer)+'</span>')+'</div></div>';

    '<div class="teacher-intro">'+icon("teacher")+'<div><h3>Түсіндіру, жаттығу, кері байланыс</h3><p>Оқушылар тіркелусіз жұмыс істейді. Нәтиже әр оқушының өз браузерінде сақталады; бұл бетте сыныптың ортақ журналы жүргізілмейді.</p></div></div>'+
    '<section class="teacher-materials">'+topics.map(function(t){return '<article class="teacher-card"><div class="teacher-card-heading">'+topicIcon(t)+'<div><h2>'+esc(t.title)+'</h2><p>'+esc(t.goal)+'</p></div></div><div class="teacher-card-actions">'+buttonLink("Сабақты ашу","#/lesson/"+t.id,"secondary","book")+'<button class="button ghost" data-action="copy" data-topic="'+t.id+'">'+icon("copy")+'Сілтемені көшіру</button><button class="button ghost" data-action="print-lesson" data-topic="'+t.id+'">'+icon("print")+'Басып шығару</button></div><details><summary>Тапсырмалар мен жауаптар</summary><ol class="teacher-answers">'+t.tasks.map(function(task){return '<li><p>'+esc(task.question)+(task.formula?' <span class="inline-math">'+esc(task.formula)+'</span>':"")+'</p><strong>Жауап: '+esc(taskAnswerText(task))+'</strong><p class="small-text">'+esc(task.explanation)+'</p></li>';}).join("")+'</ol></details></article>';}).join("")+'</section>'+
    '<section class="portable-card"><span class="portable-icon">'+icon("download")+'</span><div><span class="overline">МАТЕМАТИКА ӘРДАЙЫМ ЖАНЫҢДА</span><h2>Бір файлда барлық сабақ</h2><p>7 және 9-сыныптың ережелері, мысалдары мен жаттығуларын бір файлға жүктеп ал. Оны интернетсіз де браузерде ашуға болады.</p><button class="button primary" data-action="download-platform">'+icon("download")+'Платформаны жүктеу</button></div></section>',"teacher","Мұғалімге");
  }
  function help() {
    var questions=[
      ["Қалай бастаймын?","Алдымен 7 немесе 9-сыныпты таңда. «Тақырыптар» бөлімінен сабақ таңда. Ережені оқып, екі мысалды қара. Содан кейін «Жаттығуға өту» батырмасын бас."],
      ["Тіркелу немесе аккаунт керек пе?","Жоқ. Сайт ортақ сілтемемен ашылады. Оқушыдан ChatGPT аккаунты, аты-жөні, телефон нөмірі немесе электрондық пошта сұралмайды."],
      ["Бөлшек пен теріс санды қалай енгіземін?","1/4, 0,25 және 0.25 жазылымдары бірдей мән ретінде тексеріледі. Теріс санды −2 немесе -2 деп енгізуге болады. 30% орнына 0,3 не 3/10 енгізіңіз."],
      ["Ұпай қалай есептеледі?","Әр тапсырма ең көбі 1 ұпай береді. Бөлек өрістері бар тапсырмада барлық өріс дұрыс болуы керек. Әр бөлім — 3 ұпай. Жалпы ұпай таңдалған сыныптың тапсырма санына байланысты. Қайта орындау қосымша ұпай қоспайды."],
      ["Нәтиже қайда сақталады?","Нәтиже осы сайтты ашқан браузерде сақталады. Басқа құрылғыда автоматты көрінбейді. «Менің нәтижем» бөлімінен көшірмені жүктеп, кейін қалпына келтіруге болады."],
      ["Бір компьютерді бірнеше оқушы қолданса ше?","Келесі оқушы бастамас бұрын «Менің нәтижем» бөлімінен «Жаңа оқушы» батырмасын басып, алдыңғы нәтижені тазартуды растаңыз. Керек нәтижені алдымен жүктеп алыңыз."],
      ["Мұғалім менің нәтижемді көре ме?","Бұл нұсқада ортақ сынып журналы жоқ. Нәтиже экранын мұғалімге көрсете аласыз немесе жүктелген нәтижені өзіңіз бөлісе аласыз."],
      ["Интернетсіз қолдануға бола ма?","«Мұғалімге» бөлімінен «Платформаны жүктеу» батырмасын басыңыз. SandyQumar.html файлын браузерде ашыңыз. Бұл файл сабақтар мен жаттығуларды интернетсіз ашады; браузердің жергілікті файлға сақтау рұқсатына қарай нәтиже сақталмауы мүмкін."]
    ];
    return shell('<div class="page-heading"><span class="overline">ҚАДАМЫҢ ТҮСІНІКТІ БОЛСЫН</span><h1>Көмек және нұсқаулық</h1><p>Оқуды бастауға қажет қысқа жауаптар.</p></div><div class="help-layout"><section class="faq">'+questions.map(function(q,i){return '<details'+(i===0?' open':'')+'><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>';}).join("")+'</section><aside class="help-aside"><span class="topic-icon blue">∑</span><h2>SandyQumar</h2><p>Жобаның пән мұғалімі:<br><strong>Жұмабеков Расул Арманұлы</strong></p><p>'+topics.length+' тақырып · '+(topics.length*2)+' мысал<br>'+stats().total+' интерактивті тапсырма</p>'+buttonLink("Оқуды бастау","#/topics","primary","book")+'</aside></div>',"help","Көмек");
  }
  function notFound() {
    return shell('<section class="empty-state"><span class="empty-illustration">'+icon("search")+'</span><h1>Бұл бет табылмады</h1><p>Қажетті сабақты тақырыптар тізімінен ашып көріңіз.</p>'+buttonLink("Тақырыптарға өту","#/topics","primary","book")+'</section>',"topics","Бет табылмады");
  }
  function route() {
    var hash=location.hash || "#/";
    if(hash==="#main")return;
    if(ui.route!==hash){ui.route=hash;ui.feedback=null;ui.draft=null;ui.menu=false;}
    var parts=hash.replace(/^#\/?/,"").split("/");
    var section=parts[0];
    if ((section==="lesson" || section==="practice") && parts[1] && parts[1]!=="all") {
      var linked=topicById(parts[1]);
      if(linked && linked.grade!==activeGrade) selectGrade(linked.grade);
    }
    if(!section)app.innerHTML=home();
    else if(section==="topics")app.innerHTML=topicsPage("topics");
    else if(section==="lesson")app.innerHTML=lesson(topicById(parts[1]));
    else if(section==="practice"&&!parts[1])app.innerHTML=topicsPage("practice");
    else if(section==="practice")app.innerHTML=practice(parts[1],/^\d+$/.test(parts[2]||"0")?Number(parts[2]||0):-1);
    else if(section==="results")app.innerHTML=results();
    else if(section==="teacher")app.innerHTML=teacher();
    else if(section==="help")app.innerHTML=help();
    else app.innerHTML=notFound();
    syncNavigation();
    document.title=(section==="lesson"&&topicById(parts[1])?topicById(parts[1]).title:{"topics":"Тақырыптар","practice":"Жаттығу","results":"Менің нәтижем","teacher":"Мұғалімге","help":"Көмек"}[section]||"Түсініп үйрен")+" — SandyQumar";
  }
  function syncNavigation() {
    var sidebar=document.querySelector(".sidebar");
    if(!sidebar)return;
    var hidden=mobileMedia.matches&&!ui.menu;
    sidebar.inert=hidden;
    sidebar.setAttribute("aria-hidden",String(hidden));
  }
  mobileMedia.addEventListener("change",syncNavigation);
  function toast(message) {
    var el=document.getElementById("toast");
    el.textContent=message;el.classList.add("visible");
    clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.classList.remove("visible");},4000);
  }
  function modal(title,message,confirmText,onConfirm) {
    var overlay=document.createElement("div");
    overlay.className="modal-overlay";
    overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description"><span class="modal-icon">'+icon("help")+'</span><h2 id="modal-title">'+esc(title)+'</h2><p id="modal-description">'+esc(message)+'</p><div class="modal-actions"><button class="button secondary" data-modal-cancel>Бас тарту</button><button class="button primary" data-modal-confirm>'+esc(confirmText)+'</button></div></section>';
    var previous=document.activeElement;
    document.body.appendChild(overlay);
    var cancel=overlay.querySelector("[data-modal-cancel]"),confirm=overlay.querySelector("[data-modal-confirm]");
    function close(){overlay.remove();if(previous&&previous.isConnected)previous.focus();}
    cancel.onclick=close;
    confirm.onclick=function(){close();onConfirm();};
    overlay.addEventListener("click",function(e){if(e.target===overlay)close();});
    overlay.addEventListener("keydown",function(e){
      if(e.key==="Escape"){e.preventDefault();close();}
      if(e.key==="Tab"){e.preventDefault();(document.activeElement===cancel?confirm:cancel).focus();}
    });
    cancel.focus();
  }
  function downloadResult() {
    var blob=new Blob([JSON.stringify(store.get(),null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download="sandyqumar-natizhe.json";link.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast("Нәтиженің көшірмесі жүктелді.");
  }
  function printLesson(id) {
    var t=topicById(id);if(!t)return;
    document.getElementById("print-area").innerHTML='<header class="print-header"><strong>SandyQumar</strong><span>Аты-жөні: ____________________ &nbsp; Күні: __________</span></header><h1>'+esc(t.title)+'</h1><p><strong>Мақсат:</strong> '+esc(t.goal)+'</p><h2>Қысқаша ереже</h2>'+t.theory.map(function(p){return '<p><strong>'+esc(p.title)+'.</strong> '+esc(p.text)+'</p>';}).join("")+'<h2>Шешілген мысалдар</h2>'+t.examples.map(function(ex){return '<p><strong>'+esc(ex.title)+'</strong></p><p>'+esc(ex.expression)+'</p>';}).join("")+'<h2>Өздік жұмыс</h2>'+t.tasks.map(function(task,i){return '<div class="print-task"><p><strong>'+(i+1)+'. '+esc(task.question)+'</strong></p>'+(task.formula?'<p>'+esc(task.formula)+'</p>':"")+(task.type==="choice"?'<p>'+task.options.map(function(o,j){return String.fromCharCode(65+j)+") "+esc(o.text);}).join(" &nbsp;&nbsp; ")+'</p>':task.type==="fields"?task.fields.map(function(f){return '<p>'+esc(f.label)+': ____________________</p>';}).join(""):'<p>Жауап: ____________________</p>')+'<div class="writing-space"></div></div>';}).join("")+'<p>Нәтиже: _____ / 3 ұпай</p>';
    window.print();
  }
  app.addEventListener("submit",function(e){
    if(e.target.id!=="answer-form")return;e.preventDefault();
    var form=e.target,group=form.dataset.group,index=Number(form.dataset.index);
    var list=group==="all"?topics.flatMap(function(t){return t.tasks;}):topicById(group).tasks;
    var task=list[index],answer;
    if(task.type==="choice"){var selected=form.querySelector('input[name="choice"]:checked');answer=selected?selected.value:"";}
    else if(task.type==="number")answer=form.elements.answer.value;
    else answer=task.fields.map(function(f,i){return form.elements["field-"+i].value;});
    ui.draft=answer;ui.feedback=grader.grade(task,answer);
    if(ui.feedback.valid)store.record(task,answer,ui.feedback,ui.hints.has(task.id));
    route();
    var feedback=document.getElementById("feedback");if(feedback)feedback.focus();
  });
  app.addEventListener("input",function(e){
    if(e.target.id==="topic-search"){
      var query=e.target.value.trim().toLocaleLowerCase("kk"),shown=0;
      document.querySelectorAll("[data-topic-search]").forEach(function(card){var match=card.dataset.topicSearch.includes(query);card.hidden=!match;if(match)shown++;});
      document.getElementById("empty-search").hidden=shown>0;
    }
    if(e.target.id==="slope"||e.target.id==="intercept"){
      var k=Number(document.getElementById("slope").value),b=Number(document.getElementById("intercept").value);
      document.getElementById("explorer-graph").innerHTML=graph(k,b,false);
      document.getElementById("graph-formula").textContent="y = "+k+"x "+(b<0?"− "+Math.abs(b):"+ "+b);
      document.getElementById("slope-value").textContent="k = "+k;
      document.getElementById("intercept-value").textContent="b = "+b;
      document.getElementById("graph-values").innerHTML=[-1,0,1].map(function(x){return '<span>x = '+x+' → y = '+(k*x+b)+'</span>';}).join("");
    }
    if(e.target.type==="radio")document.querySelectorAll(".choice").forEach(function(label){label.classList.toggle("selected",label.querySelector("input").checked);});
  });
  app.addEventListener("change",function(e){
    if(e.target.id!=="import-file"||!e.target.files[0])return;
    var file=e.target.files[0];
    if(file.size>100000){toast("Файл тым үлкен. Нәтиженің JSON көшірмесін таңдаңыз.");return;}
    file.text().then(function(text){
      var input=JSON.parse(text);
      if(input.version!==1||!input.attempts||typeof input.attempts!=="object"||Array.isArray(input.attempts))throw new Error("invalid");
      var cleaned=store.validate(input),count=Object.keys(cleaned.attempts).length;
      if(!count&&Object.keys(input.attempts).length)throw new Error("invalid");
      modal("Нәтижені қалпына келтіру",count+" тапсырманың нәтижесі табылды. Осы браузердегі қазіргі нәтиже осы көшірмемен ауыстырылады.","Қалпына келтіру",function(){store.restore(cleaned);route();toast("Нәтиже қалпына келтірілді.");});
    }).catch(function(){toast("Бұл файл жарамсыз. SandyQumar нәтижесінің JSON көшірмесін таңдаңыз.");});
    e.target.value="";
  });
  app.addEventListener("click",function(e){
    var target=e.target.closest("[data-action]");if(!target)return;
    var action=target.dataset.action;
    if(action==="grade") {
      selectGrade(Number(target.dataset.grade)); ui.route=""; location.hash="#/"; route(); window.scrollTo(0,0); return;
    }
    if(action==="subject") {
      activeSubject=target.dataset.subject; route(); return;
    }
    if(action==="download-platform") {
      var clone=document.documentElement.cloneNode(true);
      ["#app","#toast","#print-area"].forEach(function(id){var el=clone.querySelector(id);if(el)el.innerHTML="";});
      var blob=new Blob(["<!doctype html>\n"+clone.outerHTML],{type:"text/html;charset=utf-8"});
      var url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="SandyQumar.html";a.click();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);toast("SandyQumar көшірмесі жүктелді.");return;
    }
    if(action==="menu"||action==="menu-close"){
      ui.menu=action==="menu"?!ui.menu:false;
      var sidebar=document.querySelector(".sidebar"),scrim=document.querySelector(".mobile-scrim"),toggle=document.querySelector(".mobile-menu");
      sidebar.classList.toggle("open",ui.menu);scrim.classList.toggle("visible",ui.menu);toggle.setAttribute("aria-expanded",String(ui.menu));
      syncNavigation();
    }
    if(action==="hint"){
      ui.hints.add(target.dataset.task);
      document.getElementById("hint-box").hidden=false;target.setAttribute("aria-expanded","true");
    }
    if(action==="export")downloadResult();
    if(action==="import")document.getElementById("import-file").click();
    if(action==="reset")modal("Жаңа оқушы бастай ма?","Осы браузердегі барлық тапсырма нәтижесі тазаланады. Қажет болса, алдымен нәтижені жүктеп алыңыз.","Нәтижені тазарту",function(){store.reset();ui.feedback=null;ui.draft=null;ui.hints.clear();route();toast("Жаңа оқу бастауға дайын.");});
    if(action==="print-lesson")printLesson(target.dataset.topic);
    if(action==="copy"){
      var url=location.href.split("#")[0]+"#/lesson/"+target.dataset.topic;
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast("Сабақ сілтемесі көшірілді.");}).catch(function(){showCopy(url);});
      else showCopy(url);
    }
  });
  function showCopy(url) {
    var overlay=document.createElement("div");overlay.className="modal-overlay";
    overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="copy-title"><h2 id="copy-title">Сабақ сілтемесі</h2><p>Сілтемені белгілеп, көшіріп алыңыз.</p><input class="answer-input" readonly aria-label="Көшіруге арналған сілтеме" value="'+esc(url)+'"><button class="button primary">Жабу</button></section>';
    document.body.appendChild(overlay);var input=overlay.querySelector("input");input.focus();input.select();
    overlay.querySelector("button").onclick=function(){overlay.remove();};
    overlay.addEventListener("keydown",function(e){if(e.key==="Escape")overlay.remove();});
  }
  window.addEventListener("hashchange",function(){route();window.scrollTo(0,0);var main=document.getElementById("main");if(main)main.focus({preventScroll:true});});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.menu){ui.menu=false;document.querySelector(".sidebar").classList.remove("open");document.querySelector(".mobile-scrim").classList.remove("visible");document.querySelector(".mobile-menu").setAttribute("aria-expanded","false");syncNavigation();document.querySelector(".mobile-menu").focus();}});
  route();
})();
</script>
</body>
</html>
